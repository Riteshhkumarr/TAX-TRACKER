version: '3.8'

services:
  # MongoDB (for local development)
  mongodb:
    image: mongo:7.0
    container_name: taxtracker-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: taxtracker
    volumes:
      - mongo_data:/data/db
    networks:
      - taxtracker-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taxtracker-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/taxtracker?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_minimum_32_chars}
      JWT_EXPIRE: 7d
      ML_SERVICE_URL: http://ml-service:8000
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - taxtracker-network

  # ML Microservice
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: taxtracker-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: 8000
    volumes:
      - ml_models:/app/models
    networks:
      - taxtracker-network

  # Frontend (served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taxtracker-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - taxtracker-network

volumes:
  mongo_data:
    driver: local
  ml_models:
    driver: local

networks:
  taxtracker-network:
    driver: bridge
